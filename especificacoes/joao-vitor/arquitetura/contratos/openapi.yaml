openapi: 3.1.0
info:
  title: Rastro API
  version: 0.2.0
  summary: Emendas parlamentares federais com valores por etapa e proveniência de cada dado.
  description: |
    API pública do Rastro (FastAPI). Todas as operações de leitura são públicas e limitadas a
    60 requisições/min por IP de cliente (REQ-28). O IP de cliente é o primeiro endereço de
    `X-Forwarded-For` quando a requisição vem do loopback (o painel repassa o IP do navegador) e o
    endereço da conexão nos demais casos (REQ-84). Só o modo de medição (`RASTRO_MEDICAO=1`, script
    de carga) dispensa o limite para o loopback sem `X-Forwarded-For` (REQ-85).
    As operações de assinatura e alerta exigem o cabeçalho `X-Chave-Assinante` (ADR-0005), exceto a
    criação da primeira assinatura, que gera a chave (REQ-80).
    Valores monetários são inteiros em centavos. Etapas diferentes nunca são somadas (REQ-15, REQ-77).
    Todo `estado_execucao` vem com `estado_texto` e `traducao_versao` da tabela de tradução vigente
    (REQ-69, ADR-0008). Parâmetro fora do domínio → 422 `parametro_invalido` (REQ-72).
    Módulos donos de cada operação (brief do grupo): tag `x-modulo` em cada operação.
    Erros seguem `application/problem+json` (RFC 9457) com o campo `codigo`.
    Os ids de requisito (REQ-xx) citados nas operações estão em `../requisitos.md`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8000
    description: Execução local (macOS), processo da API
tags:
  - name: status
  - name: emendas
  - name: municipios
  - name: agregacoes
  - name: lotes
  - name: traducoes
  - name: assinaturas
  - name: alertas
  - name: contrato

paths:
  /api/status:
    get:
      operationId: obter_status
      x-modulo: consulta
      tags: [status]
      summary: Lote ativo e resumo de cada fonte
      description: |
        Responde 200 mesmo sem lote publicado (`lote_ativo: null`), para que o painel mostre
        "Dados ainda não publicados" (REQ-60, REQ-48). Telas: cabeçalho de todas, P01.
      responses:
        '200':
          description: Situação das fontes
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/filtros/opcoes:
    get:
      operationId: listar_opcoes_filtro
      x-modulo: consulta
      tags: [emendas]
      summary: Valores possíveis dos filtros no lote ativo
      description: Alimenta os filtros de P02, P06, P08 e S01. Não inclui favorecidos (REQ-65).
      responses:
        '200':
          description: Opções
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpcoesFiltro' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/emendas:
    get:
      operationId: listar_emendas
      x-modulo: consulta
      tags: [emendas]
      summary: Lista paginada e filtrada de emendas do lote ativo
      description: REQ-20, REQ-21, REQ-66, REQ-68, REQ-69, REQ-72. Telas P02, P10.
      parameters:
        - $ref: '#/components/parameters/Ano'
        - $ref: '#/components/parameters/AutorCodigo'
        - $ref: '#/components/parameters/UfGasto'
        - $ref: '#/components/parameters/MunicipioGasto'
        - $ref: '#/components/parameters/FuncaoCodigo'
        - $ref: '#/components/parameters/Tipo'
        - name: pendentes
          in: query
          description: true = só emendas com `pago` + `rap_pago` menor que `empenhado` − `rap_cancelado` (empenhado e ainda não pago por inteiro) (REQ-68).
          schema: { type: boolean, default: false }
        - name: q
          in: query
          description: Texto livre sobre código da emenda, nome do autor e função. Nunca busca favorecidos (REQ-65).
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: ordenar
          in: query
          schema:
            type: string
            enum: [codigo, -empenhado, -liquidado, -pago]
            default: -empenhado
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Página de emendas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmendaPagina' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/emendas/{codigo}:
    get:
      operationId: obter_emenda
      x-modulo: consulta
      tags: [emendas]
      summary: Emenda com valores por etapa e proveniência
      description: REQ-14, REQ-15, REQ-16, REQ-17, REQ-18, REQ-19 (AC-1, AC-4). Tela P03.
      parameters:
        - $ref: '#/components/parameters/CodigoEmenda'
      responses:
        '200':
          description: Emenda encontrada no lote ativo
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmendaDetalhe' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/CodigoMalformado' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/emendas/{codigo}/linha-do-tempo:
    get:
      operationId: obter_linha_do_tempo
      x-modulo: consulta
      tags: [emendas]
      summary: Valores de cada etapa em todos os lotes publicados
      description: REQ-23. Tela P04.
      parameters:
        - $ref: '#/components/parameters/CodigoEmenda'
      responses:
        '200':
          description: Linha do tempo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinhaDoTempo' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/CodigoMalformado' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/emendas/{codigo}/favorecidos:
    get:
      operationId: listar_favorecidos
      x-modulo: consulta
      tags: [emendas]
      summary: Valores recebidos por favorecido de uma emenda
      description: |
        REQ-15, REQ-25, REQ-26, REQ-65. Tela P05. Itens em `ano_mes` decrescente e, no mesmo mês, por
        `nome_publicavel`; a linha agregada de pessoas físicas vem por último no mês (ordem fixa, sem ranking).
      parameters:
        - $ref: '#/components/parameters/CodigoEmenda'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Favorecidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FavorecidosPagina' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/CodigoMalformado' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/agregacoes:
    get:
      operationId: obter_agregacoes
      x-modulo: consulta
      tags: [agregacoes]
      summary: Somas por etapa agrupadas por autor, UF do gasto ou função
      description: |
        REQ-21, REQ-22, REQ-49, REQ-79, REQ-91. Tela P06 (e P01 para os recortes). Na dimensão `autor`, os grupos
        vêm em ordem alfabética, sem posição, e `ordenar_por_etapa` é ignorado: o Rastro não ranqueia
        parlamentares (REQ-71).
      parameters:
        - name: dimensao
          in: query
          required: true
          schema: { type: string, enum: [autor, uf, funcao] }
        - $ref: '#/components/parameters/Ano'
        - $ref: '#/components/parameters/UfGasto'
        - $ref: '#/components/parameters/FuncaoCodigo'
        - $ref: '#/components/parameters/Tipo'
        - name: ordenar_por_etapa
          in: query
          description: Ordena os grupos de `uf` e `funcao` pela etapa, decrescente. Ignorado em `dimensao=autor` (REQ-71).
          schema: { $ref: '#/components/schemas/Etapa' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Grupos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agregacoes' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/municipios/{uf_gasto}/{municipio_gasto}:
    get:
      operationId: obter_municipio
      x-modulo: consulta
      tags: [municipios]
      summary: Resumo das emendas com gasto num município
      description: |
        REQ-66, REQ-67, REQ-69, REQ-55. Tela P10 (morador e gestor municipal). A lista de emendas do
        município vem de `listar_emendas?uf_gasto=&municipio_gasto=` (e `pendentes=true` para o gestor).
      parameters:
        - name: uf_gasto
          in: path
          required: true
          schema:
            type: string
            enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]
        - name: municipio_gasto
          in: path
          required: true
          description: Identificador do município em `OpcoesFiltro.municipios[].municipio_gasto` (minúsculo, sem acento, com hífens; ex. `joao-pessoa`).
          schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 60 }
      responses:
        '200':
          description: Município com emendas no lote ativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MunicipioDetalhe' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/autores/{codigo}:
    get:
      operationId: obter_autor
      x-modulo: consulta
      tags: [agregacoes]
      summary: Autor com somas por etapa e suas emendas
      description: REQ-22, REQ-29. Tela P07.
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9A-Za-z]{1,10}$' }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Autor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutorDetalhe' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '422': { $ref: '#/components/responses/Invalido' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/mudancas:
    get:
      operationId: listar_mudancas
      x-modulo: nucleo
      tags: [lotes]
      summary: O que mudou entre dois lotes publicados
      description: REQ-24, REQ-61, REQ-55. Tela P08 (e a faixa de mudanças de P01).
      parameters:
        - name: lote_novo_id
          in: query
          description: Padrão = lote ativo da fonte.
          schema: { type: integer, minimum: 1 }
        - name: fonte_id
          in: query
          schema: { type: string, enum: [cgu, siga], default: cgu }
        - name: tipo
          in: query
          schema: { $ref: '#/components/schemas/TipoMudanca' }
        - $ref: '#/components/parameters/UfGasto'
        - $ref: '#/components/parameters/MunicipioGasto'
        - $ref: '#/components/parameters/AutorCodigo'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Mudanças
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MudancasPagina' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLote' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/traducoes:
    get:
      operationId: listar_traducoes
      x-modulo: nucleo
      tags: [traducoes]
      summary: Versões da tabela que traduz o estado de execução para linguagem simples
      description: |
        REQ-69, REQ-70, ADR-0008. Tela P11 ("Como traduzimos o estado"). Responde 200 mesmo sem lote
        publicado. Versões antigas nunca são alteradas: quem citou um texto pode conferir a versão.
      parameters:
        - name: versao
          in: query
          description: Uma versão específica. Sem o parâmetro, todas, da mais recente para a mais antiga.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Versões da tabela
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Traducoes' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/lotes:
    get:
      operationId: listar_lotes
      x-modulo: ingestao
      tags: [lotes]
      summary: Lotes de todas as fontes, com estado, hash e rejeições
      description: REQ-12, REQ-27. Tela P09. Responde 200 mesmo sem lote publicado.
      parameters:
        - name: fonte_id
          in: query
          schema: { type: string, enum: [cgu, siga] }
      responses:
        '200':
          description: Lotes, mais recentes primeiro
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Lote' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '422': { $ref: '#/components/responses/Invalido' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/lotes/{lote_id}:
    get:
      operationId: obter_lote
      x-modulo: ingestao
      tags: [lotes]
      summary: Um lote com rejeições por motivo e duração do ETL
      description: REQ-27, REQ-50. Tela P09 (detalhe).
      parameters:
        - name: lote_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Lote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lote' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '422': { $ref: '#/components/responses/Invalido' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/assinaturas:
    post:
      operationId: criar_assinatura
      x-modulo: saida
      tags: [assinaturas]
      summary: Cria uma assinatura (e a chave do assinante, se não informada)
      description: |
        Sem `X-Chave-Assinante`: cria um Assinante e devolve `chave_assinante` uma única vez (REQ-31).
        Com chave: cria a assinatura para o assinante (REQ-33). REQ-34, REQ-41, REQ-42, REQ-62, REQ-80, REQ-87. Telas S01 → S02/S04.
      security:
        - {}
        - chaveAssinante: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssinaturaNova' }
      responses:
        '201':
          description: Assinatura criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssinaturaCriada' }
        '401': { $ref: '#/components/responses/ChaveInvalida' }
        '422': { $ref: '#/components/responses/AssinaturaInvalida' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/SemLoteOuOcupado' }
        '500': { $ref: '#/components/responses/ErroInterno' }
    get:
      operationId: listar_assinaturas
      x-modulo: saida
      tags: [assinaturas]
      summary: Assinaturas do assinante
      description: REQ-32. Telas S03 (validação da chave) e S04.
      security:
        - chaveAssinante: []
      responses:
        '200':
          description: Assinaturas
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: '#/components/schemas/Assinatura' }
        '401': { $ref: '#/components/responses/ChaveInvalida' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/assinaturas/{assinatura_id}:
    parameters:
      - name: assinatura_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: atualizar_assinatura
      x-modulo: saida
      tags: [assinaturas]
      summary: Pausa ou retoma uma assinatura
      description: REQ-38. Tela S04.
      security:
        - chaveAssinante: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              additionalProperties: false
              properties:
                estado: { type: string, enum: [ativa, pausada] }
      responses:
        '200':
          description: Assinatura atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assinatura' }
        '401': { $ref: '#/components/responses/ChaveInvalida' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/BancoOcupado' }
        '500': { $ref: '#/components/responses/ErroInterno' }
    delete:
      operationId: excluir_assinatura
      x-modulo: saida
      tags: [assinaturas]
      summary: Exclui a assinatura e seus alertas
      description: REQ-40. Tela S04.
      security:
        - chaveAssinante: []
      responses:
        '204': { description: Excluída }
        '401': { $ref: '#/components/responses/ChaveInvalida' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/BancoOcupado' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/alertas:
    get:
      operationId: listar_alertas
      x-modulo: saida
      tags: [alertas]
      summary: Alertas do assinante, mais recentes primeiro
      description: REQ-32, REQ-35. Tela S05 e contador do cabeçalho.
      security:
        - chaveAssinante: []
      parameters:
        - name: lido
          in: query
          schema: { type: boolean }
        - name: assinatura_id
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertasPagina' }
        '401': { $ref: '#/components/responses/ChaveInvalida' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '422': { $ref: '#/components/responses/Invalido' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /api/alertas/{alerta_id}:
    patch:
      operationId: atualizar_alerta
      x-modulo: saida
      tags: [alertas]
      summary: Marca um alerta como lido (idempotente)
      description: REQ-39. Tela S05.
      security:
        - chaveAssinante: []
      parameters:
        - name: alerta_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lido]
              additionalProperties: false
              properties:
                lido: { type: boolean, const: true }
      responses:
        '200':
          description: Alerta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alerta' }
        '401': { $ref: '#/components/responses/ChaveInvalida' }
        '404': { $ref: '#/components/responses/NaoEncontrada' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '503': { $ref: '#/components/responses/BancoOcupado' }
        '500': { $ref: '#/components/responses/ErroInterno' }

  /openapi.json:
    get:
      operationId: obter_contrato
      x-modulo: consulta
      tags: [contrato]
      summary: Este contrato em JSON
      description: REQ-30. Tela D01.
      responses:
        '200':
          description: Documento OpenAPI 3.1
          content:
            application/json:
              schema: { type: object }
        '429': { $ref: '#/components/responses/LimiteDeTaxa' }
        '500': { $ref: '#/components/responses/ErroInterno' }

components:
  securitySchemes:
    chaveAssinante:
      type: apiKey
      in: header
      name: X-Chave-Assinante
      description: Chave de 128 bits (32 caracteres hex) gerada em `criar_assinatura`. Nunca vai na URL.

  headers:
    XRequestId:
      description: Identificador da requisição, exibido nos estados de erro do painel (REQ-46).
      schema: { type: string }

  parameters:
    CodigoEmenda:
      name: codigo
      in: path
      required: true
      description: Código da emenda (12 dígitos). Fora do padrão → 422 (REQ-17).
      schema: { type: string, example: '202512340001' }
    Ano:
      name: ano
      in: query
      schema: { type: integer, enum: [2025], default: 2025 }
    AutorCodigo:
      name: autor_codigo
      in: query
      schema: { type: string }
    UfGasto:
      name: uf_gasto
      in: query
      description: Sigla da UF do gasto, ou `NM` para nacional/múltiplas UFs (REQ-78).
      schema: { $ref: '#/components/schemas/UfGasto' }
    MunicipioGasto:
      name: municipio_gasto
      in: query
      description: |
        Município do gasto (`OpcoesFiltro.municipios[].municipio_gasto`). Exige `uf_gasto` de uma UF; sem ela,
        ou com `uf_gasto = NM`, a resposta é 422 `parametro_invalido` (REQ-66, REQ-72).
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 60 }
    FuncaoCodigo:
      name: funcao_codigo
      in: query
      schema: { type: string }
    Tipo:
      name: tipo
      in: query
      description: Tipo de emenda como publicado pela CGU.
      schema: { type: string }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PorPagina:
      name: por_pagina
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Invalido:
      description: Parâmetro fora do domínio do contrato (`codigo = parametro_invalido`, REQ-72), com o parâmetro em `campos`
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    CodigoMalformado:
      description: Código fora do padrão de 12 dígitos (`codigo = codigo_malformado`, REQ-17)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    NaoEncontrada:
      description: Emenda inexistente no lote ativo (`emenda_nao_encontrada`, REQ-18); autor, lote, município, versão de tradução, assinatura ou alerta inexistente (`nao_encontrado`, REQ-55)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemLote:
      description: Nenhum lote publicado (`codigo = sem_lote_publicado`, REQ-19)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ChaveInvalida:
      description: Chave de assinante ausente ou desconhecida (`codigo = chave_invalida`, REQ-32)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    AssinaturaInvalida:
      description: Filtro vazio, condição incompleta ou município sem UF (`assinatura_invalida`, REQ-34, REQ-62, REQ-87) ou limite de 20 (`limite_assinaturas`, REQ-42)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    ErroInterno:
      description: Erro inesperado (`codigo = erro_interno`), sempre com `X-Request-Id` e `request_id` no corpo (REQ-46)
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    SemLoteOuOcupado:
      description: Sem lote publicado (`sem_lote_publicado`, REQ-19) ou escrita esperando a publicação por mais de 5 s (`banco_ocupado`, com `Retry-After`, REQ-96)
      headers:
        Retry-After:
          schema: { type: integer, description: segundos; só com banco_ocupado }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    BancoOcupado:
      description: Escrita esperou mais de 5 s pela trava do banco durante uma publicação (`codigo = banco_ocupado`, REQ-96)
      headers:
        Retry-After:
          schema: { type: integer, description: segundos }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
    LimiteDeTaxa:
      description: Mais de 60 requisições/min do mesmo IP de cliente (REQ-28, REQ-84)
      headers:
        Retry-After:
          schema: { type: integer, description: segundos }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }

  schemas:
    Problema:
      type: object
      required: [type, title, status, codigo]
      properties:
        type: { type: string, format: uri-reference, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        codigo:
          type: string
          enum:
            - codigo_malformado
            - emenda_nao_encontrada
            - nao_encontrado
            - sem_lote_publicado
            - chave_invalida
            - assinatura_invalida
            - limite_assinaturas
            - parametro_invalido
            - limite_de_taxa
            - banco_ocupado
            - erro_interno
        campos:
          type: array
          description: Campos inválidos (422)
          items:
            type: object
            required: [campo, mensagem]
            properties:
              campo: { type: string }
              mensagem: { type: string }
        request_id: { type: string }

    SiglaUf:
      type: string
      description: Sigla de uma UF (sem `NM`).
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO]

    UfGasto:
      type: string
      description: UF do gasto; `NM` = nacional ou múltiplas UFs (REQ-78).
      enum: [AC, AL, AP, AM, BA, CE, DF, ES, GO, MA, MT, MS, MG, PA, PB, PR, PE, PI, RJ, RN, RS, RO, RR, SC, SP, SE, TO, NM]

    Etapa:
      type: string
      enum: [empenhado, liquidado, pago, rap_inscrito, rap_cancelado, rap_pago]
      description: Grandezas distintas, nunca somadas entre si (REQ-15).

    EstadoExecucao:
      type: string
      enum: [sem_execucao, empenhada, liquidada, paga]
      description: Derivado da etapa mais avançada com valor > 0 (ADR-0006).

    EstadoComTexto:
      type: object
      description: Estado de execução com a tradução vigente (REQ-69, ADR-0008).
      required: [estado_execucao, estado_texto, traducao_versao]
      properties:
        estado_execucao: { $ref: '#/components/schemas/EstadoExecucao' }
        estado_texto:
          type: string
          description: '`TabelaTraducao.texto_simples` da versão vigente, ex. "A entrega foi conferida; falta pagar"'
        traducao_versao: { type: integer, minimum: 1 }

    TipoMudanca:
      type: string
      enum: [nova_emenda, valor_alterado, estado_alterado]

    Proveniencia:
      type: object
      description: Origem de um valor (REQ-14).
      required: [fonte_id, fonte_nome, lote_id, data_referencia, importado_em, hash_sha256, url_download]
      properties:
        fonte_id: { type: string, enum: [cgu, siga] }
        fonte_nome: { type: string }
        lote_id: { type: integer }
        data_referencia: { type: string, format: date }
        importado_em:
          type: string
          format: date-time
          description: Data de extração do arquivo da fonte (`LoteImportacao.importado_em`)
        hash_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        url_download: { type: string, format: uri }

    LoteResumo:
      type: object
      required: [id, fonte_id, estado, data_referencia, hash_sha256]
      description: '`data_referencia` e `hash_sha256` são null só num lote `falhou` por `fonte_indisponivel` (REQ-12)'
      properties:
        id: { type: integer }
        fonte_id: { type: string, enum: [cgu, siga] }
        estado:
          type: string
          enum: [importando, validado, publicado, substituido, recusado, falhou]
        data_referencia: { type: [string, 'null'], format: date }
        hash_sha256: { type: [string, 'null'] }
        publicado_em: { type: [string, 'null'], format: date-time }

    Lote:
      allOf:
        - $ref: '#/components/schemas/LoteResumo'
        - type: object
          required: [arquivo_nome, importado_em, linhas_lidas, linhas_aceitas, linhas_rejeitadas, rejeicoes]
          properties:
            fonte_nome: { type: string }
            arquivo_nome: { type: [string, 'null'] }
            importado_em: { type: string, format: date-time }
            linhas_lidas: { type: integer, minimum: 0 }
            linhas_aceitas: { type: integer, minimum: 0 }
            linhas_rejeitadas: { type: integer, minimum: 0 }
            motivo_falha:
              type: [string, 'null']
              enum: [formato_alterado, fonte_indisponivel, interrompido, rejeicoes_acima_do_limite, sem_linhas_no_recorte, null]
            rejeicoes:
              type: array
              items:
                type: object
                required: [motivo, quantidade]
                properties:
                  motivo:
                    type: string
                    enum: [codigo_invalido, ano_fora_do_recorte, valor_malformado, linha_malformada, emenda_sem_cadastro]
                  quantidade: { type: integer, minimum: 1 }
            duracao_etl_ms:
              type: [object, 'null']
              properties:
                leitura: { type: integer }
                validacao: { type: integer }
                gravacao: { type: integer }
                publicacao: { type: integer }
            ativo: { type: boolean, description: É o lote apontado por PublicacaoAtiva }

    ValorEtapa:
      type: object
      required: [etapa, valor_centavos]
      properties:
        etapa: { $ref: '#/components/schemas/Etapa' }
        valor_centavos: { type: integer, minimum: 0 }

    ValorComProveniencia:
      allOf:
        - $ref: '#/components/schemas/ValorEtapa'
        - type: object
          required: [data_referencia, proveniencia]
          properties:
            data_referencia: { type: string, format: date }
            proveniencia: { $ref: '#/components/schemas/Proveniencia' }

    AutorResumo:
      type: object
      required: [codigo, nome, tipo]
      properties:
        codigo: { type: string }
        nome: { type: string }
        tipo: { type: string, enum: [parlamentar, bancada, comissao, relator, outro] }

    Status:
      type: object
      required: [fontes]
      properties:
        fontes:
          type: array
          items:
            type: object
            required: [fonte_id, fonte_nome, habilitada, url_download, lote_ativo]
            properties:
              fonte_id: { type: string, enum: [cgu, siga] }
              fonte_nome: { type: string }
              habilitada: { type: boolean }
              url_download: { type: string, format: uri }
              lote_ativo:
                oneOf:
                  - $ref: '#/components/schemas/LoteResumo'
                  - type: 'null'
              resumo:
                type: [object, 'null']
                description: Totais do lote ativo, por etapa e sem somar etapas (P01)
                properties:
                  quantidade_emendas: { type: integer }
                  valores:
                    type: array
                    items: { $ref: '#/components/schemas/ValorEtapa' }
                  quantidade_mudancas: { type: integer, description: MudancaLote do lote ativo }
              proveniencia:
                description: Origem dos valores de `resumo` (REQ-14); null sem lote publicado
                oneOf:
                  - $ref: '#/components/schemas/Proveniencia'
                  - type: 'null'

    OpcoesFiltro:
      type: object
      required: [autores, ufs_gasto, municipios, funcoes, tipos, proveniencia]
      properties:
        autores:
          type: array
          description: Em ordem alfabética (REQ-71)
          items: { $ref: '#/components/schemas/AutorResumo' }
        ufs_gasto:
          type: array
          items: { $ref: '#/components/schemas/UfGasto' }
        municipios:
          type: array
          description: Municípios com ao menos uma emenda no lote ativo (REQ-66), em ordem alfabética
          items:
            type: object
            required: [uf_gasto, municipio_gasto, municipio_nome]
            properties:
              uf_gasto: { $ref: '#/components/schemas/SiglaUf' }
              municipio_gasto: { type: string, description: 'Identificador usado em `obter_municipio` e no parâmetro `municipio_gasto`' }
              municipio_nome: { type: string, description: Nome como publicado na localidade do gasto, ex. "João Pessoa" }
        funcoes:
          type: array
          items:
            type: object
            required: [funcao_codigo, funcao_nome]
            properties:
              funcao_codigo: { type: string }
              funcao_nome: { type: string }
        tipos:
          type: array
          items: { type: string }
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }

    EmendaResumo:
      type: object
      required: [codigo, ano, tipo, autor, uf_gasto, municipio_gasto, funcao_nome, estado_execucao, estado_texto, traducao_versao, valores]
      properties:
        codigo: { type: string }
        ano: { type: integer }
        tipo: { type: string }
        autor: { $ref: '#/components/schemas/AutorResumo' }
        uf_gasto: { $ref: '#/components/schemas/UfGasto' }
        municipio_gasto: { type: [string, 'null'], description: 'Identificador do município do gasto, o mesmo de `obter_municipio` (ex. joao-pessoa); null se a localidade não é um município (REQ-66, REQ-88)' }
        municipio_nome: { type: [string, 'null'], description: Nome como publicado (ex. João Pessoa) }
        funcao_nome: { type: string }
        estado_execucao: { $ref: '#/components/schemas/EstadoExecucao' }
        estado_texto: { type: string, description: Tradução vigente do estado (REQ-69) }
        traducao_versao: { type: integer }
        valores:
          type: array
          items: { $ref: '#/components/schemas/ValorEtapa' }

    EmendaPagina:
      type: object
      required: [itens, total, pagina, por_pagina, proveniencia]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/EmendaResumo' }
        total: { type: integer }
        pagina: { type: integer }
        por_pagina: { type: integer }
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }

    EmendaDetalhe:
      type: object
      required: [codigo, ano, numero, tipo, autor, localidade_gasto, uf_gasto, municipio_gasto, funcao_codigo, funcao_nome, estado_execucao, estado_texto, traducao_versao, valores, soma_valor_recebido_centavos, proveniencia]
      properties:
        codigo: { type: string }
        ano: { type: integer }
        numero: { type: string }
        tipo: { type: string }
        autor: { $ref: '#/components/schemas/AutorResumo' }
        localidade_gasto: { type: string }
        uf_gasto: { $ref: '#/components/schemas/UfGasto' }
        municipio_gasto: { type: [string, 'null'], description: 'Identificador usado em `obter_municipio` (REQ-66, REQ-88)' }
        municipio_nome: { type: [string, 'null'] }
        funcao_codigo: { type: string }
        funcao_nome: { type: string }
        subfuncao_nome: { type: [string, 'null'] }
        programa_nome: { type: [string, 'null'] }
        acao_nome: { type: [string, 'null'] }
        estado_execucao: { $ref: '#/components/schemas/EstadoExecucao' }
        estado_texto: { type: string, description: Tradução vigente do estado (REQ-69) }
        traducao_versao: { type: integer }
        valores:
          type: array
          description: Um item por (fonte, etapa). Valores de fontes diferentes não são somados (REQ-13).
          items: { $ref: '#/components/schemas/ValorComProveniencia' }
        soma_valor_recebido_centavos:
          type: integer
          description: Soma de RegistroFavorecido.valor_recebido_centavos. Grandeza distinta de "pago" (REQ-15).
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }

    LinhaDoTempo:
      type: object
      required: [codigo_emenda, etapas, estados, proveniencia]
      properties:
        codigo_emenda: { type: string }
        etapas:
          type: array
          items:
            type: object
            required: [etapa, pontos]
            properties:
              etapa: { $ref: '#/components/schemas/Etapa' }
              pontos:
                type: array
                items:
                  type: object
                  required: [lote_id, data_referencia, valor_centavos, proveniencia]
                  properties:
                    lote_id: { type: integer }
                    data_referencia: { type: string, format: date }
                    valor_centavos: { type: integer }
                    proveniencia: { $ref: '#/components/schemas/Proveniencia', description: Origem do valor naquele lote (REQ-14) }
        estados:
          type: array
          description: estado_execucao em cada lote
          items:
            type: object
            required: [lote_id, data_referencia, estado_execucao, estado_texto, traducao_versao]
            properties:
              lote_id: { type: integer }
              data_referencia: { type: string, format: date }
              estado_execucao: { $ref: '#/components/schemas/EstadoExecucao' }
              estado_texto: { type: string, description: Tradução vigente (REQ-69) }
              traducao_versao: { type: integer }
        proveniencia: { $ref: '#/components/schemas/Proveniencia', description: Lote ativo, que define a lista de etapas e a tradução }

    Favorecido:
      type: object
      required: [id, codigo_origem, tipo, nome_publicavel]
      properties:
        id: { type: integer }
        codigo_origem: { type: string, description: CNPJ ou código do ente como publicado pela CGU }
        tipo: { type: string, enum: [pessoa_juridica, ente_publico, outro], description: Pessoa física nunca é identificada (REQ-25, ADR-0007) }
        nome_publicavel: { type: string }
        natureza_juridica: { type: [string, 'null'] }
        uf: { type: [string, 'null'] }
        municipio: { type: [string, 'null'] }

    FavorecidosPagina:
      type: object
      required: [itens, total, soma_valor_recebido_centavos, aviso, proveniencia]
      properties:
        itens:
          type: array
          items:
            type: object
            required: [favorecido, pessoas_fisicas, ano_mes, valor_recebido_centavos]
            description: Um favorecido identificado (pessoa jurídica, ente público) ou a linha agregada de pessoas físicas do mês (REQ-25)
            properties:
              favorecido:
                description: Null na linha agregada de pessoas físicas
                oneOf:
                  - $ref: '#/components/schemas/Favorecido'
                  - type: 'null'
              pessoas_fisicas:
                description: Só na linha agregada; null nas demais
                oneOf:
                  - type: object
                    required: [quantidade]
                    properties:
                      quantidade: { type: integer, minimum: 1, description: Pessoas físicas distintas que receberam no mês }
                  - type: 'null'
              ano_mes: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
              valor_recebido_centavos: { type: integer }
        total: { type: integer }
        soma_valor_recebido_centavos: { type: integer }
        aviso:
          type: string
          const: Recebimento registrado não comprova a aplicação final do recurso nem indica irregularidade.
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }

    Agregacoes:
      type: object
      required: [dimensao, grupos, total_grupos, pagina, proveniencia]
      properties:
        dimensao: { type: string, enum: [autor, uf, funcao] }
        total_grupos: { type: integer }
        pagina: { type: integer }
        grupos:
          type: array
          description: Em `dimensao=autor`, ordem alfabética de `rotulo`, sem posição (REQ-71)
          items:
            type: object
            required: [chave, rotulo, coletivo, quantidade_emendas, valores]
            properties:
              chave: { type: string, description: autor_codigo, uf_gasto (NM = nacional/múltiplas) ou funcao_codigo }
              rotulo: { type: string }
              coletivo: { type: boolean, description: Autor não parlamentar (bancada, comissão, relator) (REQ-79) }
              quantidade_emendas: { type: integer }
              valores:
                type: array
                items: { $ref: '#/components/schemas/ValorEtapa' }
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }

    AutorDetalhe:
      allOf:
        - $ref: '#/components/schemas/AutorResumo'
        - type: object
          required: [quantidade_emendas, valores, emendas, proveniencia]
          properties:
            proveniencia: { $ref: '#/components/schemas/Proveniencia' }
            quantidade_emendas: { type: integer }
            valores:
              type: array
              items: { $ref: '#/components/schemas/ValorEtapa' }
            emendas: { $ref: '#/components/schemas/EmendaPagina' }

    MudancaLote:
      type: object
      required: [id, fonte_id, codigo_emenda, lote_novo_id, tipo, traducao_versao]
      properties:
        id: { type: integer }
        fonte_id: { type: string, enum: [cgu, siga] }
        codigo_emenda: { type: string }
        lote_anterior_id: { type: integer, description: O primeiro lote de uma fonte não gera mudanças (REQ-08) }
        lote_novo_id: { type: integer }
        tipo: { $ref: '#/components/schemas/TipoMudanca' }
        etapa:
          description: Só em `valor_alterado`; null em `nova_emenda` (uma linha por emenda nova) e em `estado_alterado`
          oneOf:
            - $ref: '#/components/schemas/Etapa'
            - type: 'null'
        valor_antes_centavos: { type: [integer, 'null'] }
        valor_depois_centavos: { type: [integer, 'null'] }
        estado_antes:
          oneOf:
            - $ref: '#/components/schemas/EstadoExecucao'
            - type: 'null'
        estado_depois:
          oneOf:
            - $ref: '#/components/schemas/EstadoExecucao'
            - type: 'null'
        autor_nome: { type: string }
        uf_gasto: { $ref: '#/components/schemas/UfGasto' }
        municipio_gasto: { type: [string, 'null'], description: Identificador do município (REQ-66) }
        municipio_nome: { type: [string, 'null'] }
        estado_antes_texto:
          type: [string, 'null']
          description: Tradução vigente de `estado_antes` (REQ-69)
        estado_depois_texto:
          type: [string, 'null']
          description: Tradução vigente de `estado_depois` (REQ-69)
        traducao_versao: { type: integer, description: Versão da tabela de tradução usada nos dois textos (REQ-69) }

    MudancasPagina:
      type: object
      required: [lote_anterior, lote_novo, itens, total, contagem_por_tipo, proveniencia]
      properties:
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }
        lote_anterior:
          oneOf:
            - $ref: '#/components/schemas/LoteResumo'
            - type: 'null'
        lote_novo: { $ref: '#/components/schemas/LoteResumo' }
        itens:
          type: array
          items: { $ref: '#/components/schemas/MudancaLote' }
        total: { type: integer }
        contagem_por_tipo:
          type: object
          properties:
            nova_emenda: { type: integer }
            valor_alterado: { type: integer }
            estado_alterado: { type: integer }

    AssinaturaNova:
      type: object
      required: [nome, condicao]
      additionalProperties: false
      description: Pelo menos um filtro_* preenchido (REQ-34). Nenhum dado pessoal (REQ-41).
      properties:
        nome: { type: string, minLength: 1, maxLength: 80 }
        filtro_codigo_emenda: { type: [string, 'null'], pattern: '^[0-9]{12}$' }
        filtro_autor_codigo: { type: [string, 'null'] }
        filtro_uf_gasto:
          oneOf:
            - $ref: '#/components/schemas/UfGasto'
            - type: 'null'
        filtro_municipio_gasto:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Exige `filtro_uf_gasto` de uma UF; sem ela, 422 `assinatura_invalida` (REQ-87)
        filtro_funcao_codigo: { type: [string, 'null'] }
        condicao: { type: string, enum: [limiar_valor, mudanca_estado] }
        etapa:
          oneOf:
            - $ref: '#/components/schemas/Etapa'
            - type: 'null'
        limiar_centavos: { type: [integer, 'null'], minimum: 1 }

    Assinatura:
      type: object
      required: [id, nome, descricao, condicao, canal, estado, lote_base_id, criada_em, alertas_nao_lidos, alertas_total]
      properties:
        id: { type: integer }
        nome: { type: string }
        filtro_codigo_emenda: { type: [string, 'null'] }
        filtro_autor_codigo: { type: [string, 'null'] }
        filtro_uf_gasto:
          oneOf:
            - $ref: '#/components/schemas/UfGasto'
            - type: 'null'
        filtro_municipio_gasto:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Exige `filtro_uf_gasto` de uma UF; sem ela, 422 `assinatura_invalida` (REQ-87)
        filtro_funcao_codigo: { type: [string, 'null'] }
        condicao: { type: string, enum: [limiar_valor, mudanca_estado] }
        etapa:
          oneOf:
            - $ref: '#/components/schemas/Etapa'
            - type: 'null'
        limiar_centavos: { type: [integer, 'null'] }
        canal: { type: string, const: painel }
        estado: { type: string, enum: [ativa, pausada] }
        lote_base_id: { type: integer }
        criada_em: { type: string, format: date-time }
        alertas_nao_lidos: { type: integer }
        alertas_total: { type: integer, description: Mostrado na confirmação de exclusão (REQ-40) }
        descricao:
          type: string
          description: Resumo legível montado pela API com os rótulos do lote ativo, ex. "Saúde · gasto em João Pessoa (PB) · pago passar de R$ 1.000.000,00"

    AssinaturaCriada:
      type: object
      required: [assinatura, chave_assinante]
      properties:
        assinatura: { $ref: '#/components/schemas/Assinatura' }
        chave_assinante:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
          description: Presente só quando a chamada criou o assinante; nunca é devolvida de novo (REQ-31).

    Alerta:
      type: object
      required: [id, assinatura_id, assinatura_nome, assinatura_condicao, criado_em, lido_em, mudanca, lote_novo, proveniencia]
      properties:
        id: { type: integer }
        assinatura_id: { type: integer }
        assinatura_nome: { type: string }
        assinatura_condicao: { type: string, enum: [limiar_valor, mudanca_estado] }
        assinatura_etapa:
          oneOf:
            - $ref: '#/components/schemas/Etapa'
            - type: 'null'
        assinatura_limiar_centavos: { type: [integer, 'null'] }
        valor_etapa_lote_novo_centavos:
          type: [integer, 'null']
          description: Em alertas de limiar, o valor da etapa da assinatura no lote novo (lido em `RegistroExecucao`), inclusive quando a mudança é `nova_emenda` (REQ-63); null nos demais
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }
        criado_em: { type: string, format: date-time }
        lido_em: { type: [string, 'null'], format: date-time }
        mudanca: { $ref: '#/components/schemas/MudancaLote' }
        lote_novo: { $ref: '#/components/schemas/LoteResumo' }

    AlertasPagina:
      type: object
      required: [itens, total, nao_lidos]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/Alerta' }
        total: { type: integer }
        nao_lidos: { type: integer }

    MunicipioDetalhe:
      type: object
      description: Resumo de um município do gasto no lote ativo (REQ-67). Etapas nunca somadas (REQ-77).
      required: [uf_gasto, municipio_gasto, municipio_nome, quantidade_emendas, valores, por_estado, quantidade_pendentes, traducao_versao, proveniencia]
      properties:
        uf_gasto: { $ref: '#/components/schemas/SiglaUf' }
        municipio_gasto: { type: string }
        municipio_nome: { type: string }
        quantidade_emendas: { type: integer, minimum: 1 }
        valores:
          type: array
          items: { $ref: '#/components/schemas/ValorEtapa' }
        por_estado:
          type: array
          description: Uma linha por estado, na ordem sem_execucao → paga, mesmo com quantidade 0
          items:
            allOf:
              - $ref: '#/components/schemas/EstadoComTexto'
              - type: object
                required: [quantidade]
                properties:
                  quantidade: { type: integer, minimum: 0 }
        quantidade_pendentes:
          type: integer
          description: Emendas com `pago` + `rap_pago` menor que `empenhado` − `rap_cancelado`, o mesmo recorte de `pendentes=true` (REQ-68)
        traducao_versao: { type: integer }
        proveniencia: { $ref: '#/components/schemas/Proveniencia' }

    Traducoes:
      type: object
      required: [vigente, versoes]
      properties:
        vigente: { type: integer, description: Número da versão usada nas respostas atuais }
        versoes:
          type: array
          items:
            type: object
            required: [versao, vigente_desde, itens]
            properties:
              versao: { type: integer, minimum: 1 }
              vigente_desde: { type: string, format: date-time }
              nota: { type: [string, 'null'], description: Motivo da mudança, escrito por quem publicou a versão }
              itens:
                type: array
                description: Exatamente um item por valor de `estado_execucao` (REQ-86)
                items:
                  type: object
                  required: [estado_execucao, texto_simples, explicacao]
                  properties:
                    estado_execucao: { $ref: '#/components/schemas/EstadoExecucao' }
                    texto_simples: { type: string, maxLength: 60 }
                    explicacao: { type: string, maxLength: 280 }
